name: Shared Build Workflow

on:
  workflow_call:

jobs:
  build:
    name: Build Firmware
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Setup Toolchain
        run: |
          # Pin Arch Linux package repository snapshot
          sed -i 's/CheckSpace/#CheckSpace/' /etc/pacman.conf
          echo 'Server = https://archive.archlinux.org/repos/2026/09/12/$repo/os/$arch' > /etc/pacman.d/mirrorlist
          pacman -Syy --noconfirm
          pacman -S --noconfirm --needed \
            git \
            cmake \
            ninja \
            python \
            arm-none-eabi-gcc \
            arm-none-eabi-binutils

      - name: Configure Git Safe Directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Get picolibc submodule SHA
        id: picolibc_sha
        run: echo "sha=$(git -C lib/picolibc rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache picolibc
        uses: actions/cache@v6
        with:
          path: build/picolibc-m3
          key: picolibc-arch-${{ steps.picolibc_sha.outputs.sha }}-${{ hashFiles('.github/workflows/build-shared.yml', 'lib/picolibc.cmake', 'lib/stm32/cmake/picolibc-cortex-m3.cmake') }}

      - name: Display Tools Version
        run: |
          arm-none-eabi-gcc --version
          arm-none-eabi-ld --version
          cmake --version
          ninja --version
          python --version

      - name: Configure CMake
        run: cmake --preset MinSizeRel

      - name: Build Firmware
        run: cmake --build --preset MinSizeRel

      - name: Archive Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: MDO-1A-app
          path: |
            build/MinSizeRel/*.bin
            build/MinSizeRel/*.elf
            build/MinSizeRel/*.uf2
            build/MinSizeRel/*.map
          if-no-files-found: error
          retention-days: 7
